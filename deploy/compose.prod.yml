# Staging/production override. Requires a filled .env (see .env.example); PENDAR_ENV=staging|prod.
# The api refuses to start without PENDAR_JWT_SECRET (>=32 chars) and PENDAR_CREDENTIALS_KEY.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    ports: !reset []
    restart: unless-stopped
    environment:
      PENDAR_CORS_ORIGINS: ${PENDAR_CORS_ORIGINS:?set PENDAR_CORS_ORIGINS}
      PENDAR_ALLOW_DEV_SEED_USER: "false"
  worker:
    restart: unless-stopped
  beat:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports: !override ["${WEB_PORT:-80}:80"]
