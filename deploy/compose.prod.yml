# Staging/production override. Requires a filled .env (see .env.example); FINOPS_ENV=staging|prod.
# The api refuses to start without FINOPS_JWT_SECRET (>=32 chars) and FINOPS_CREDENTIALS_KEY.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    ports: !reset []
    restart: unless-stopped
    environment:
      FINOPS_CORS_ORIGINS: ${FINOPS_CORS_ORIGINS:?set FINOPS_CORS_ORIGINS}
      FINOPS_ALLOW_DEV_SEED_USER: "false"
  worker:
    restart: unless-stopped
  beat:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports: !override ["${WEB_PORT:-80}:80"]
