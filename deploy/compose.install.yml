# Installed as /opt/finops-agent/compose.yml by install.sh and run by `finops-agent`. Prebuilt images only.
name: finops-agent

x-app: &app
  image: ${FINOPS_APP_IMAGE}
  restart: unless-stopped
  # every setting in .env (sudo finops-agent config set ...); the ones below are fixed by the installation
  env_file: .env
  environment:
    FINOPS_ENV: prod
    FINOPS_DATABASE_URL: postgresql+psycopg://finops:${POSTGRES_PASSWORD}@postgres:5432/finops
    FINOPS_REDIS_URL: redis://redis:6379/0
    FINOPS_SYNC_MODE: celery
    FINOPS_ALLOW_REGISTRATION: "false"
    FINOPS_STORAGE_DIR: /app/var/uploads

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finops
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *app
    command: ["api"]
    volumes: [uploads:/app/var/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 30

  worker:
    <<: *app
    command: ["worker"]
    volumes: [uploads:/app/var/uploads, catalog:/app/var/catalog]
    depends_on:
      api: {condition: service_healthy}

  beat:
    <<: *app
    command: ["beat"]
    depends_on:
      api: {condition: service_healthy}

  web:
    image: ${FINOPS_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${FINOPS_HTTP_BIND:-80}:80"
      # the port the app is served on; HTTPS_BIND is that port, or IP:PORT behind your own proxy
      - "${FINOPS_HTTPS_BIND:-443}:${FINOPS_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - catalog:/srv/catalog:ro

volumes:
  pgdata:
  uploads:
  catalog:
  caddy_data:
  caddy_config:
