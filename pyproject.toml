[project]
name = "pendar-finops"
version = "0.1.0"
description = "Iran-first AI-assisted FinOps platform with a deterministic pricing core"
requires-python = ">=3.12"
# Dependencies: requirements.txt / requirements-dev.txt (pinned; used by Docker and CI).

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api", "apps/worker", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "E741"]  # Depends() defaults are idiomatic FastAPI; `l` = line item

[tool.ruff.lint.isort]
known-first-party = ["pricing_engine", "recommendation_engine", "provider_adapters", "ai_gateway", "invoice_parser", "shared_types", "pendar_api", "pendar_worker", "tests"]
