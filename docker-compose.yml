# Local/dev stack, reachable from this machine only: `make dev` (or `docker compose up --build`) -> http://localhost:8080
# Staging/prod: docker compose -f docker-compose.yml -f deploy/compose.prod.yml --env-file .env up -d
name: finops-agent

x-app-env: &app-env
  FINOPS_ENV: ${FINOPS_ENV:-dev}
  FINOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-finops-dev-password}@postgres:5432/${POSTGRES_DB:-finops}
  FINOPS_REDIS_URL: redis://redis:6379/0
  FINOPS_SYNC_MODE: celery
  FINOPS_JWT_SECRET: ${FINOPS_JWT_SECRET:-dev-only-change-me-not-for-production-use}
  FINOPS_CREDENTIALS_KEY: ${FINOPS_CREDENTIALS_KEY:-}
  FINOPS_ALLOW_REGISTRATION: ${FINOPS_ALLOW_REGISTRATION:-true}
  FINOPS_AI_PROVIDER: ${FINOPS_AI_PROVIDER:-offline}
  FINOPS_AI_MODEL: ${FINOPS_AI_MODEL:-claude-opus-5-5}
  FINOPS_ANTHROPIC_API_KEY: ${FINOPS_ANTHROPIC_API_KEY:-}
  FINOPS_STORAGE_DIR: /app/var/uploads
  FINOPS_SMTP_HOST: ${FINOPS_SMTP_HOST:-}
  FINOPS_SMTP_PORT: ${FINOPS_SMTP_PORT:-587}
  FINOPS_SMTP_USER: ${FINOPS_SMTP_USER:-}
  FINOPS_SMTP_PASSWORD: ${FINOPS_SMTP_PASSWORD:-}
  FINOPS_ALERT_EMAIL_TO: ${FINOPS_ALERT_EMAIL_TO:-}
  FINOPS_BALE_BOT_TOKEN: ${FINOPS_BALE_BOT_TOKEN:-}
  FINOPS_BALE_CHAT_ID: ${FINOPS_BALE_CHAT_ID:-}
  FINOPS_INVOICE_RETENTION_DAYS: ${FINOPS_INVOICE_RETENTION_DAYS:-30}
  FINOPS_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-finops}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finops}"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: ["api"]
    environment: *app-env
    volumes: [uploads:/app/var/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 30
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: .
    command: ["worker"]
    environment: *app-env
    volumes: [uploads:/app/var/uploads]
    depends_on:
      api: {condition: service_healthy}

  beat:
    build: .
    command: ["beat"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  web:
    build: ./apps/web
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:8080:80"]

volumes:
  pgdata:
  uploads:
