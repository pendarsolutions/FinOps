stages: [test, build, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "packages:apps/api:apps/worker"

python-tests:
  stage: test
  image: python:3.12-slim
  cache: {paths: [.cache/pip]}
  script:
    - pip install -r requirements-dev.txt
    - ruff check packages apps/api apps/worker tests
    - pytest -q --junitxml=report.xml
  artifacts:
    reports: {junit: report.xml}

postgres-migration:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: pendar
    POSTGRES_PASSWORD: pendar
    POSTGRES_DB: pendar
    PENDAR_DATABASE_URL: postgresql+psycopg://pendar:pendar@postgres:5432/pendar
  script:
    - pip install -r requirements.txt
    - python -m pendar_api.cli migrate
    - python -m pendar_api.cli seed-pricing
    - python -m pendar_api.cli seed-pricing   # idempotency check
    - alembic check

web:
  stage: test
  image: node:24-alpine
  script:
    - cd apps/web
    - npm ci
    - npm run typecheck
    - npm run build

build-images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA" .
    - docker build -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" apps/web
    - docker push "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"

deploy-staging:
  stage: deploy
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH', when: manual}]
  script:
    - echo "Deploy with: docker compose -f docker-compose.yml -f deploy/compose.prod.yml --env-file \$STAGING_ENV_FILE up -d (see docs/runbook.md)"
