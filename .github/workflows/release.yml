# Push a tag such as v0.2.0 to publish a release. See docs/releasing.md.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check packages apps/api apps/worker tests
      - run: pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag, installer, changelog and notes agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          fail() { echo "::error::$*"; exit 1; }
          grep -q "^VERSION=\"$version\"" deploy/finops-agent \
            || fail "deploy/finops-agent VERSION is not $version (run scripts/bump-version.sh $version)"
          grep -q "^IMAGE_PREFIX=\"ghcr.io/$owner\"" deploy/finops-agent \
            || fail "deploy/finops-agent IMAGE_PREFIX must be ghcr.io/$owner, where this workflow publishes the images"
          grep -q "^## \[$version\]" CHANGELOG.md || fail "CHANGELOG.md has no [$version] section"
          test -f "docs/releases/$GITHUB_REF_NAME.md" || fail "docs/releases/$GITHUB_REF_NAME.md is missing"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREFIX=ghcr.io/$owner" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}

      - name: Build the installer and the offline bundle
        env:
          FINOPS_IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          FINOPS_VERSION="$VERSION" FINOPS_IMAGE_PREFIX="$PREFIX" scripts/make-installer.sh install.sh.release
          FINOPS_IMAGE_PREFIX="$PREFIX" scripts/make-bundle.sh "$VERSION"

      - name: Publish the images
        run: |
          docker push "$PREFIX/finops-agent-app:$VERSION"
          docker push "$PREFIX/finops-agent-web:$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the one-file installer goes up as install.sh, which releases/latest/download/install.sh points at
          mkdir -p upload
          cp install.sh.release upload/install.sh
          mv "finops-agent-$VERSION.tar.gz" upload/
          (cd upload && sha256sum install.sh "finops-agent-$VERSION.tar.gz" > SHA256SUMS)
          sed -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" -e "s|{{VERSION}}|$VERSION|g" "docs/releases/$GITHUB_REF_NAME.md" > notes.md
          gh release create "$GITHUB_REF_NAME" upload/install.sh "upload/finops-agent-$VERSION.tar.gz" upload/SHA256SUMS \
            --title "FinOps agent $VERSION" --notes-file notes.md --verify-tag
