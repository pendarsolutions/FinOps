# The public website (site/): built on every change, and published with GitHub Pages once it's switched on.
#
# To publish: Settings -> Pages -> Source: GitHub Actions, and set the custom domain there. Then add the repository
# variable SITE_DOMAIN with that domain (Settings -> Secrets and variables -> Actions -> Variables). Until
# SITE_DOMAIN is set this only builds. site/dist works on any static host too; see site/README.md.
name: Site
on:
  push:
    branches: [main]
    paths: ["site/**", "apps/web/src/pendar/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: site}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: site/package-lock.json}
      - run: npm ci
      - run: npm run build
      - name: Serve the latest release's installer at /install.sh as well
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern install.sh --dir dist || echo "no release has install.sh yet"
      - if: vars.SITE_DOMAIN != ''
        uses: actions/upload-pages-artifact@v3
        with: {path: site/dist}

  deploy:
    if: vars.SITE_DOMAIN != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/deploy-pages@v4
