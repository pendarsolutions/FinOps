name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check packages apps/api apps/worker tests
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: finops, POSTGRES_PASSWORD: finops, POSTGRES_DB: finops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finops" --health-interval 5s --health-retries 20
    env:
      PYTHONPATH: packages:apps/api:apps/worker
      FINOPS_DATABASE_URL: postgresql+psycopg://finops:finops@localhost:5432/finops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m finops_api.cli migrate
      - run: python -m finops_api.cli seed-pricing
      - run: python -m finops_api.cli seed-pricing   # idempotency check

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: bash -n scripts/make-bundle.sh
